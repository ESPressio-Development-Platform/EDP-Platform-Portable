name: Portable providers and narrow ESP32 MemoryResource qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'demos/memory-resource-basic/**'
      - '.github/workflows/validation.yml'
      - 'library.json'
      - 'library.properties'

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout explicit EDP provider and transitive Memory test sources
        shell: bash
        run: |
          set -euo pipefail
          for repo in EDP-System EDP-Platform EDP-BoundedTopology EDP-Memory; do
            git clone --quiet --depth 1 --branch main "https://github.com/ESPressio-Development-Platform/${repo}.git" "../${repo}"
          done
      - name: Build warning-clean C++20 host contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B /tmp/edp-portable-host -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DEDP_SYSTEM_SOURCE_DIR="$GITHUB_WORKSPACE/../EDP-System" \
            -DEDP_PLATFORM_SOURCE_DIR="$GITHUB_WORKSPACE/../EDP-Platform" \
            -DEDP_MEMORY_SOURCE_DIR="$GITHUB_WORKSPACE/../EDP-Memory" \
            -DEDP_BOUNDED_TOPOLOGY_SOURCE_DIR="$GITHUB_WORKSPACE/../EDP-BoundedTopology"
          cmake --build /tmp/edp-portable-host --parallel 2
          /tmp/edp-portable-host/portable_provider_tests
          /tmp/edp-portable-host/portable_memory_provider_tests

  esp32-narrow-resource:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [PlatformIO_Arduino, PlatformIO_ESP-IDF]
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: python3 -m pip install --user platformio
      - name: Compile public MemoryResource demo for ESP32
        shell: bash
        run: |
          set -euo pipefail
          python3 -m platformio run -d "demos/memory-resource-basic/${{ matrix.target }}" -j 2
