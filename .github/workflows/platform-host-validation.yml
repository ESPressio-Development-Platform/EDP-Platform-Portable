name: Platform host validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portable
        uses: actions/checkout@v4
        with:
          path: portable

      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          ref: main
          path: platform

      - name: Checkout System
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          ref: main
          path: system

      - name: Configure Platform tests
        run: >
          cmake
          -S platform/tests
          -B build-platform
          -DEDP_SYSTEM_SOURCE_DIR="$GITHUB_WORKSPACE/system"

      - name: Build Platform tests
        run: cmake --build build-platform --parallel

      - name: Run Platform synchronization contracts
        run: ./build-platform/synchronization_contract_tests

      - name: Run Platform execution contracts
        run: ./build-platform/execution_contract_tests

      - name: Configure Portable tests
        run: >
          cmake
          -S portable/tests
          -B build-portable
          -DEDP_PLATFORM_SOURCE_DIR="$GITHUB_WORKSPACE/platform"
          -DEDP_SYSTEM_SOURCE_DIR="$GITHUB_WORKSPACE/system"

      - name: Build Portable tests
        run: cmake --build build-portable --parallel

      - name: Run Portable provider tests
        run: ./build-portable/portable_provider_tests
